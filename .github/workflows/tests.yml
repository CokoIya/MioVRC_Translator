name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest + ruff (Windows, Python 3.11)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # The suite drives PySide6 widgets; the runner has no desktop session.
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install the locked runtime plus the test tools
        # --no-deps mirrors rebuild_release_environment.ps1: with resolution on,
        # rapidocr's metadata pulls CPU onnxruntime over the locked DirectML build.
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -r requirements.lock.txt
          python -m pip install "pytest>=8,<10" pytest-qt pytest-subtests "ruff==0.15.22"

      - name: Ruff
        run: python -m ruff check src tests main.py

      - name: Tests
        run: python -m pytest -q -p no:cacheprovider
